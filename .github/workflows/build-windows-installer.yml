name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Inno Setup
        run: |
          choco install innosetup -y
      
      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows-installer\setup.iss
      
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: PasswordGenerator-Setup
          path: windows-installer/output/*.exe
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows-installer/output/*.exe
          name: Password Generator ${{ github.ref_name }}
          body: |
            ## Password Generator ${{ github.ref_name }}
            
            ### Downloads
            | File | Description |
            |------|-------------|
            | `PasswordGenerator-Setup.exe` | Windows Installer (recommended) |
            
            See the [README](https://github.com/zhuyikai2002/password-generator/blob/main/README.md) for full documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
